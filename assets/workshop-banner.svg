<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="220" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d141c" />
      <stop offset="50%" stop-color="#0a0f15" />
      <stop offset="100%" stop-color="#06090d" />
    </linearGradient>

    <!-- Top Accent Line Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="20%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1" />
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1196" height="216" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect x="150" y="2" width="900" height="2" fill="url(#accentGrad)" />

  <!-- ================= LEFT COLUMN ================= -->
  <!-- Tagline using single text + tspan to guarantee zero overlap -->
  <circle cx="48" cy="42" r="3.5" fill="#10b981" filter="url(#glow)" />
  <text x="60" y="45" font-size="11" font-weight="700" letter-spacing="1.2">
    <tspan fill="#10b981">BIGTH!NKAI × GDSC UMD</tspan>
    <tspan fill="#475569">   ·   </tspan>
    <tspan fill="#64748b" font-weight="600">HACKTOBERFEST 2026</tspan>
  </text>

  <!-- Two-line Title to cleanly avoid colliding with right box -->
  <text x="48" y="78" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="-0.3">Build &amp; Test an Agentic</text>
  <text x="48" y="108" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="-0.3">AI Code Reviewer</text>

  <!-- Clean Subtitle -->
  <text x="48" y="136" fill="#94a3b8" font-size="12.5" font-weight="400">
    Follow 1 PR from model suspicion to sandbox test proof.
  </text>

  <!-- Companion App Pill -->
  <rect x="48" y="154" width="410" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="62" y="175" fill="#cbd5e1" font-size="11" font-weight="500">
    Companion Web App: <tspan fill="#38bdf8" font-weight="600">review-lab-umd.vercel.app</tspan>
  </text>

  <!-- ================= RIGHT COLUMN: 4-STAGE PIPELINE ================= -->
  <g id="pipeline" transform="translate(500, 28)">
    <!-- Pipeline Box Background -->
    <rect x="0" y="0" width="650" height="162" rx="10" fill="#0b0f15" fill-opacity="0.75" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <text x="24" y="24" fill="#64748b" font-size="10.5" font-weight="700" letter-spacing="1.2">4-STAGE AGENTIC REVIEW PIPELINE</text>

    <!-- Node 0: PR Diff -->
    <g transform="translate(24, 42)">
      <rect width="80" height="50" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="40" y="24" fill="#f1f5f9" font-size="11.5" font-weight="700" text-anchor="middle">PR Diff</text>
      <text x="40" y="39" fill="#94a3b8" font-size="8.5" font-weight="500" text-anchor="middle">Untrusted</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 108 67 L 126 67" stroke="#475569" stroke-width="1.5" />
    <polygon points="126,64 132,67 126,70" fill="#64748b" />

    <!-- Node 1: Review -->
    <g transform="translate(136, 42)">
      <rect width="94" height="50" rx="6" fill="#0f766e" fill-opacity="0.25" stroke="#14b8a6" stroke-width="1" />
      <text x="47" y="24" fill="#2dd4bf" font-size="11.5" font-weight="700" text-anchor="middle">1. Review</text>
      <text x="47" y="39" fill="#5eead4" font-size="8.5" font-weight="500" text-anchor="middle">Initial Plan</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 234 67 L 252 67" stroke="#475569" stroke-width="1.5" />
    <polygon points="252,64 258,67 252,70" fill="#64748b" />

    <!-- Node 2: Investigate -->
    <g transform="translate(262, 42)">
      <rect width="104" height="50" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
      <text x="52" y="24" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">2. Investigate</text>
      <text x="52" y="39" fill="#7dd3fc" font-size="8.5" font-weight="500" text-anchor="middle">AST Scanner</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 370 67 L 388 67" stroke="#475569" stroke-width="1.5" />
    <polygon points="388,64 394,67 388,70" fill="#64748b" />

    <!-- Node 3: Verify -->
    <g transform="translate(398, 42)">
      <rect width="98" height="50" rx="6" fill="#b45309" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1" />
      <text x="49" y="24" fill="#fbbf24" font-size="11.5" font-weight="700" text-anchor="middle">3. Verify</text>
      <text x="49" y="39" fill="#fde68a" font-size="8.5" font-weight="500" text-anchor="middle">Sandbox Test</text>
    </g>

    <!-- Arrow 4 -->
    <path d="M 500 67 L 518 67" stroke="#475569" stroke-width="1.5" />
    <polygon points="518,64 524,67 518,70" fill="#64748b" />

    <!-- Node 4: Deliver -->
    <g transform="translate(528, 42)">
      <rect width="98" height="50" rx="6" fill="#15803d" fill-opacity="0.25" stroke="#22c55e" stroke-width="1" />
      <text x="49" y="24" fill="#4ade80" font-size="11.5" font-weight="700" text-anchor="middle">4. Deliver</text>
      <text x="49" y="39" fill="#86efac" font-size="8.5" font-weight="500" text-anchor="middle">Line Anchors</text>
    </g>

    <!-- Self-Repair Feedback Loop (Arc from Verify back to Review) -->
    <path d="M 447 96 C 447 136, 183 136, 183 98" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="180,100 183,94 186,100" fill="#f59e0b" />
    <rect x="235" y="126" width="160" height="20" rx="10" fill="#1c1917" stroke="#b45309" stroke-width="0.8" />
    <text x="315" y="140" fill="#fbbf24" font-size="9" font-weight="600" text-anchor="middle">↺ Feedback Loop on Test Fail</text>
  </g>
</svg>
